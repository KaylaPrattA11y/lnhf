# BUILD SETTINGS ---------
# Runs the Astro build and deploys the "dist" output folder
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# LOCAL DEV SETTINGS ------
# Runs the Astro dev server on port 4321
[dev]
  command = "npm run dev"
  targetPort = 4321

# EDGE FUNCTIONS ----------
# Restrict selected routes by source IP using netlify/edge-functions/ip-allowlist.js
# Configure allowed IPs with env var: IP_ALLOWLIST="1.2.3.4,5.6.7.0/24"
[[edge_functions]]
  function = "ip-allowlist"
  path = "/admin"

[[edge_functions]]
  function = "ip-allowlist"
  path = "/admin/*"

[[edge_functions]]
  function = "ip-allowlist"
  path = "/booking-manager"

[[edge_functions]]
  function = "ip-allowlist"
  path = "/booking-manager/*"

[[edge_functions]]
  function = "ip-allowlist"
  path = "/.netlify/functions/admin-*"

# SCHEDULED FUNCTIONS -----
# Synchronize seeded tour slots from tour-time-slots content monthly
# Schedule - cron expression: "minute hour day-of-month month day-of-week"
[functions."generate-seeded-tour-slots"]
  schedule = "0 0 1 * *"

# REDIRECTS ---------------
# Redirect /sitemap.xml to /sitemap-index.xml (Astro's default sitemap name)
# so bots looking for the common path still find it
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
# Redirect from individual Rooms pages to About page, scrolling down to Photo Gallery
[[redirects]]
  from = "/room/*"
  to = "/about#waterfront"
  status = 301
# Redirect from old Tours page to new Tours page
[[redirects]]
  from = "/tour/"
  to = "/tours/"
  status = 301

# HEADERS -----------------
# Cache Astro's hashed static assets (JS, CSS, fonts) for 1 year
# "immutable" tells browsers these files will never change (the hash changes instead)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images for 1 year
[[headers]]
  for = "images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Security headers on all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options              = "SAMEORIGIN"
    X-Content-Type-Options       = "nosniff"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security    = "max-age=63072000; includeSubDomains; preload"
